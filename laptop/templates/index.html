<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TARS — OLED Web Cockpit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #030712; color: #f3f4f6; font-family: ui-monospace, monospace; }
    .neon-cyan { text-shadow: 0 0 8px rgba(6, 182, 212, 0.6); }
    .neon-amber { text-shadow: 0 0 8px rgba(245, 158, 11, 0.6); }
    .hud-border { border: 1px solid rgba(6, 182, 212, 0.3); }
    #joystick-zone { touch-action: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col p-3 md:p-6 select-none">

  <!-- Top Header HUD -->
  <header class="flex justify-between items-center pb-3 border-b border-gray-800">
    <div class="flex items-center space-x-3">
      <div class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></div>
      <h1 class="text-xl md:text-2xl font-bold tracking-widest neon-cyan">TARS COCKPIT</h1>
      <span class="text-xs bg-gray-900 border border-cyan-800 text-cyan-300 px-2 py-0.5 rounded">4WD UGV</span>
    </div>
    <div class="flex items-center space-x-4 text-xs md:text-sm">
      <div>SONAR: <span id="hud-sonar" class="font-bold text-cyan-400">-- cm</span></div>
      <div>MODE: <span id="hud-mode" class="font-bold text-amber-400">MANUAL</span></div>
      <button onclick="openPersonalityModal()" class="bg-gray-800 hover:bg-gray-700 text-cyan-300 px-3 py-1 rounded border border-cyan-700 transition">
        ⚙️ Personality
      </button>
    </div>
  </header>

  <!-- Main View Grid -->
  <main class="grid grid-cols-1 lg:grid-cols-3 gap-4 mt-4 flex-grow">

    <!-- Video Feed Panel (2 Columns) -->
    <div class="lg:col-span-2 bg-black rounded-lg hud-border p-2 flex flex-col">
      <div class="relative bg-gray-950 rounded flex items-center justify-center flex-grow overflow-hidden min-h-[300px]">
        <img id="camera-stream" src="/video_feed" alt="TARS Camera Stream" class="w-full h-full object-contain">
        <div id="obstacle-banner" class="hidden absolute top-4 left-1/2 -translate-x-1/2 bg-red-900/90 text-red-200 border border-red-500 px-4 py-1 rounded text-xs font-bold tracking-widest animate-pulse">
          ⚠️ OBSTACLE WARNING (&lt;15CM)
        </div>
      </div>

      <!-- Mode Switcher Bar -->
      <div class="grid grid-cols-4 gap-2 mt-3 text-xs md:text-sm font-semibold">
        <button onclick="setMode('MANUAL')" class="mode-btn bg-cyan-900 text-cyan-200 py-2 rounded border border-cyan-500" data-mode="MANUAL">MANUAL</button>
        <button onclick="setMode('PUPPY_HUNT')" class="mode-btn bg-gray-900 text-gray-400 hover:text-white py-2 rounded border border-gray-800" data-mode="PUPPY_HUNT">🐶 PUPPY HUNT</button>
        <button onclick="setMode('FOLLOW')" class="mode-btn bg-gray-900 text-gray-400 hover:text-white py-2 rounded border border-gray-800" data-mode="FOLLOW">🚶 FOLLOW</button>
        <button onclick="setMode('SENTRY')" class="mode-btn bg-gray-900 text-gray-400 hover:text-white py-2 rounded border border-gray-800" data-mode="SENTRY">🛡️ SENTRY</button>
      </div>
    </div>

    <!-- Teleoperation Controls Panel (1 Column) -->
    <div class="bg-gray-950 rounded-lg hud-border p-4 flex flex-col justify-between space-y-4">
      
      <!-- Speed & Camera Tilt Sliders -->
      <div class="space-y-4">
        <div>
          <div class="flex justify-between text-xs mb-1">
            <span>MOTOR SPEED LIMITER</span>
            <span id="speed-display" class="text-cyan-400">50%</span>
          </div>
          <input type="range" id="speed-slider" min="20" max="100" value="50" class="w-full accent-cyan-400 bg-gray-800 rounded">
        </div>

        <div>
          <div class="flex justify-between text-xs mb-1">
            <span>CAMERA TILT (SERVO)</span>
            <span id="tilt-display" class="text-amber-400">0°</span>
          </div>
          <input type="range" id="tilt-slider" min="-45" max="35" value="0" class="w-full accent-amber-400 bg-gray-800 rounded">
          <div class="flex justify-between text-[10px] text-gray-500 mt-0.5">
            <span>Floor (-45°)</span>
            <span>Level (0°)</span>
            <span>Eye Level (+35°)</span>
          </div>
        </div>
      </div>

      <!-- Virtual Touch Joystick Zone -->
      <div class="flex flex-col items-center justify-center">
        <span class="text-xs text-gray-500 mb-2">MOBILE TOUCH JOYSTICK / WASD KEYS</span>
        <div id="joystick-zone" class="relative w-44 h-44 rounded-full border border-cyan-800 bg-gray-900/60 flex items-center justify-center">
          <div id="joystick-knob" class="w-16 h-16 rounded-full bg-cyan-500/80 border-2 border-cyan-300 shadow-lg cursor-pointer transition-transform"></div>
        </div>
      </div>

      <!-- Quick Stop Button -->
      <button onclick="sendMotion('STOP', 0)" class="w-full bg-red-900 hover:bg-red-800 text-red-100 font-bold py-3 rounded border border-red-600 transition">
        EMERGENCY STOP (FIST / HALT)
      </button>
    </div>
  </main>

  <!-- Personality Settings Modal -->
  <div id="personality-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-gray-900 border border-cyan-600 rounded-lg p-5 max-w-md w-full space-y-4">
      <div class="flex justify-between items-center border-b border-gray-800 pb-2">
        <h2 class="text-lg font-bold text-cyan-300">TARS 6-Axis Personality Matrix</h2>
        <button onclick="closePersonalityModal()" class="text-gray-400 hover:text-white">&times;</button>
      </div>

      <div class="space-y-3 text-xs">
        <div><label class="flex justify-between"><span>Humor</span><span id="val-humor">75%</span></label><input type="range" id="p-humor" min="0" max="100" value="75" class="w-full accent-cyan-400"></div>
        <div><label class="flex justify-between"><span>Honesty</span><span id="val-honesty">95%</span></label><input type="range" id="p-honesty" min="0" max="100" value="95" class="w-full accent-cyan-400"></div>
        <div><label class="flex justify-between"><span>Sarcasm</span><span id="val-sarcasm">90%</span></label><input type="range" id="p-sarcasm" min="0" max="100" value="90" class="w-full accent-cyan-400"></div>
        <div><label class="flex justify-between"><span>Irritability</span><span id="val-irritability">30%</span></label><input type="range" id="p-irritability" min="0" max="100" value="30" class="w-full accent-cyan-400"></div>
        <div><label class="flex justify-between"><span>Courage</span><span id="val-courage">90%</span></label><input type="range" id="p-courage" min="0" max="100" value="90" class="w-full accent-cyan-400"></div>
        <div><label class="flex justify-between"><span>Loyalty</span><span id="val-loyalty">95%</span></label><input type="range" id="p-loyalty" min="0" max="100" value="95" class="w-full accent-cyan-400"></div>
      </div>

      <div class="pt-2">
        <label class="text-xs text-gray-400 block mb-1">Passcode Authorization:</label>
        <input type="password" id="p-passcode" placeholder="Enter Bravo-Charlie-9" class="w-full bg-black border border-gray-700 px-3 py-1.5 rounded text-sm text-cyan-300 focus:outline-none focus:border-cyan-400">
      </div>

      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closePersonalityModal()" class="px-3 py-1 bg-gray-800 rounded text-sm text-gray-300">Cancel</button>
        <button onclick="savePersonality()" class="px-4 py-1 bg-cyan-700 hover:bg-cyan-600 rounded text-sm text-white font-bold">Apply Matrix</button>
      </div>
    </div>
  </div>

  <script>
    let currentSpeed = 50;

    // Sliders
    document.getElementById('speed-slider').oninput = function() {
      currentSpeed = parseInt(this.value);
      document.getElementById('speed-display').innerText = currentSpeed + '%';
    };

    document.getElementById('tilt-slider').oninput = function() {
      const angle = parseInt(this.value);
      document.getElementById('tilt-display').innerText = angle + '°';
      fetch('/api/tilt', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ angle: angle })
      });
    };

    // Mode Switching
    function setMode(mode) {
      fetch('/api/mode', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ mode: mode })
      }).then(() => {
        document.querySelectorAll('.mode-btn').forEach(btn => {
          if (btn.dataset.mode === mode) {
            btn.className = 'mode-btn bg-cyan-900 text-cyan-200 py-2 rounded border border-cyan-500';
          } else {
            btn.className = 'mode-btn bg-gray-900 text-gray-400 hover:text-white py-2 rounded border border-gray-800';
          }
        });
        document.getElementById('hud-mode').innerText = mode;
      });
    }

    // Motion Control API
    function sendMotion(action, speed) {
      fetch('/api/control', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ action: action, speed: speed })
      });
    }

    // Keyboard WASD Controls
    const activeKeys = {};
    window.addEventListener('keydown', (e) => {
      if (activeKeys[e.key]) return;
      activeKeys[e.key] = true;
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') sendMotion('FWD', currentSpeed);
      else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') sendMotion('BWD', currentSpeed);
      else if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') sendMotion('LEFT', currentSpeed);
      else if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') sendMotion('RIGHT', currentSpeed);
      else if (e.key === ' ') sendMotion('STOP', 0);
    });

    window.addEventListener('keyup', (e) => {
      delete activeKeys[e.key];
      if (Object.keys(activeKeys).length === 0) {
        sendMotion('STOP', 0);
      }
    });

    // Touch Virtual Joystick with Dead-Man Stop
    const zone = document.getElementById('joystick-zone');
    const knob = document.getElementById('joystick-knob');
    let dragging = false;
    const maxRadius = 55;

    function handleJoystickMove(clientX, clientY) {
      const rect = zone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      let dx = clientX - centerX;
      let dy = clientY - centerY;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
      }

      knob.style.transform = `translate(${dx}px, ${dy}px)`;

      // Normalized vectors (-1.0 to 1.0)
      const normX = dx / maxRadius;
      const normY = -dy / maxRadius; // invert Y so up is positive

      fetch('/api/joystick', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ x: normX, y: normY, speed: currentSpeed })
      });
    }

    function resetJoystick() {
      dragging = false;
      knob.style.transform = 'translate(0px, 0px)';
      sendMotion('STOP', 0);
    }

    zone.addEventListener('pointerdown', (e) => { dragging = true; zone.setPointerCapture(e.pointerId); handleJoystickMove(e.clientX, e.clientY); });
    zone.addEventListener('pointermove', (e) => { if (dragging) handleJoystickMove(e.clientX, e.clientY); });
    zone.addEventListener('pointerup', resetJoystick);
    zone.addEventListener('pointercancel', resetJoystick);

    // Live Telemetry WebSocket
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${location.host}/ws/telemetry`);
    ws.onmessage = function(event) {
      try {
        const data = JSON.parse(event.data);
        if (data.dist_cm !== undefined) {
          const dist = parseFloat(data.dist_cm);
          document.getElementById('hud-sonar').innerText = dist.toFixed(1) + ' cm';
          const banner = document.getElementById('obstacle-banner');
          if (dist <= 15.0) {
            banner.classList.remove('hidden');
          } else {
            banner.classList.add('hidden');
          }
        }
        if (data.mode) {
          document.getElementById('hud-mode').innerText = data.mode;
        }
      } catch (err) {}
    };

    // Personality Modal
    function openPersonalityModal() { document.getElementById('personality-modal').classList.remove('hidden'); }
    function closePersonalityModal() { document.getElementById('personality-modal').classList.add('hidden'); }

    ['humor', 'honesty', 'sarcasm', 'irritability', 'courage', 'loyalty'].forEach(axis => {
      const el = document.getElementById(`p-${axis}`);
      if (el) {
        el.oninput = () => document.getElementById(`val-${axis}`).innerText = el.value + '%';
      }
    });

    function savePersonality() {
      const passcode = document.getElementById('p-passcode').value;
      const payload = {
        passcode: passcode,
        humor: parseInt(document.getElementById('p-humor').value),
        honesty: parseInt(document.getElementById('p-honesty').value),
        sarcasm: parseInt(document.getElementById('p-sarcasm').value),
        irritability: parseInt(document.getElementById('p-irritability').value),
        courage: parseInt(document.getElementById('p-courage').value),
        loyalty: parseInt(document.getElementById('p-loyalty').value)
      };

      fetch('/api/personality', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      }).then(res => {
        if (res.ok) {
          alert('Personality Matrix Persisted!');
          closePersonalityModal();
        } else {
          alert('Authorization Failed! Invalid Passcode.');
        }
      });
    }
  </script>
</body>
</html>
